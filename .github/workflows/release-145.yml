name: Validate and publish v1.4.5 stable
on:
  push:
    branches:
      - codex/hole-refresh-watchdog-145-test2
      - master
  workflow_dispatch:

permissions:
  contents: write

# Never race two builds while replacing the same prerelease asset.
concurrency:
  group: stable-145-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-stable-release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Restore native NuGet dependencies
        shell: pwsh
        run: |
          nuget install packages.config -OutputDirectory packages -NonInteractive
      - name: Build x64 release and core tests
        shell: pwsh
        run: |
          msbuild '小窗.slnx' /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:SmokeTestAsInvoker=false /m /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          & './x64/Release/XiaoChuang.Tests.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed' }
      - name: Package stable release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fileVersion = (Get-Item 'x64/Release/XiaoChuang.exe').VersionInfo.FileVersion
          if ($fileVersion -ne '1.4.5.0') { throw "Expected 1.4.5.0 EXE resource, got $fileVersion" }
          $root = 'Mini-Window-Browser-v1.4.5-x64'
          New-Item -ItemType Directory -Path $root | Out-Null
          Copy-Item 'x64/Release/XiaoChuang.exe' $root
          $loader = Get-ChildItem -Path 'x64/Release','packages/Microsoft.Web.WebView2.1.0.4078.44' -Filter WebView2Loader.dll -Recurse -File | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $loader) { throw 'Missing x64 WebView2Loader.dll' }
          Copy-Item $loader.FullName $root
          Copy-Item '用户手册.md' (Join-Path $root 'README-使用说明.md')
          # Keep developer smoke-test records and changelogs in GitHub; the ZIP
          # should contain only files ordinary users actually need.
          Copy-Item '开启鼠标穿透和隐藏标题栏按0.txt' $root
          Copy-Item '小窗吸附后按住Ctrl拖动.txt' $root
          Copy-Item '长时间白屏时右键标签页重载.txt' $root
          Copy-Item 'LICENSE.txt' $root
          Copy-Item 'THIRD_PARTY_NOTICES.txt' $root
          New-Item -ItemType Directory -Path (Join-Path $root 'licenses') | Out-Null
          Copy-Item 'packages/Microsoft.Web.WebView2.1.0.4078.44/LICENSE.txt' (Join-Path $root 'licenses/WebView2-SDK-LICENSE.txt')
          Copy-Item 'packages/Microsoft.Web.WebView2.1.0.4078.44/NOTICE.txt' (Join-Path $root 'licenses/WebView2-SDK-NOTICE.txt')
          Copy-Item 'packages/Microsoft.Windows.ImplementationLibrary.1.0.250325.1/LICENSE' (Join-Path $root 'licenses/WIL-LICENSE.txt')
          Copy-Item 'packages/Microsoft.Windows.ImplementationLibrary.1.0.250325.1/ThirdPartyNotices.txt' (Join-Path $root 'licenses/WIL-ThirdPartyNotices.txt')
          foreach ($hintName in @(
            '开启鼠标穿透和隐藏标题栏按0.txt',
            '小窗吸附后按住Ctrl拖动.txt',
            '长时间白屏时右键标签页重载.txt')) {
            $hint = Get-Item (Join-Path $root $hintName)
            if ($hint.Length -ne 0) { throw "Reminder must be empty: $hintName" }
          }
          $expected = @(
            'XiaoChuang.exe', 'WebView2Loader.dll', 'README-使用说明.md',
            '开启鼠标穿透和隐藏标题栏按0.txt', '小窗吸附后按住Ctrl拖动.txt',
            '长时间白屏时右键标签页重载.txt',
            'LICENSE.txt', 'THIRD_PARTY_NOTICES.txt', 'licenses')
          $actual = @(Get-ChildItem -LiteralPath $root | Select-Object -ExpandProperty Name)
          $unexpected = @($actual | Where-Object { $_ -notin $expected })
          if ($unexpected.Count -gt 0 -or $actual.Count -ne $expected.Count) {
            throw "Unexpected package contents: $($actual -join ', ')"
          }
          Compress-Archive -Path $root -DestinationPath "$root.zip"
          Get-FileHash "$root.zip" -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: Mini-Window-Browser-v1.4.5-x64
          path: Mini-Window-Browser-v1.4.5-x64.zip
          if-no-files-found: error
      - name: Publish official v1.4.5 (master only)
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '1.4.5'
          $zip = 'Mini-Window-Browser-v1.4.5-x64.zip'
          # Official releases are immutable. A later master push must not
          # silently change its binary or notes.
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to check stable tag' }
          if ($existing) {
            Write-Host "Official $tag tag already exists. Not overwriting the published release."
            exit 0
          }
          gh release create $tag $zip --target "${{ github.sha }}" --title '小窗浏览器 v1.4.5 正式版' --notes-file 'RELEASE_NOTES-1.4.5.md' --latest
          if ($LASTEXITCODE -ne 0) { throw 'Official release creation failed' }
